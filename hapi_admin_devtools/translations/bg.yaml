configuration:
  github_username:
    name: Потребителско име в GitHub
    description: >-
      GitHub акаунтът, който публикува точния публичен SSH ключ. За този build се приема само PasevSU.
  openpgp_fingerprint:
    name: OpenPGP fingerprint
    description: >-
      Пълният OpenPGP fingerprint на GPG подписващия ключ, регистриран в GitHub. Изисква се detached OpenPGP подпис на еднократно съобщение.
