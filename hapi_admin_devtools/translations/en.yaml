configuration:
  github_username:
    name: GitHub username
    description: >-
      GitHub account that publishes the exact pinned public SSH key. Only PasevSU is accepted by this build.
  github_ssh_fingerprint:
    name: SSH SHA256 fingerprint
    description: >-
      SHA256 fingerprint of the provided personal SSH RSA public key. Administrative tools remain locked until signed proof is verified.
