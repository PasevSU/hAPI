configuration:
  github_username:
    name: GitHub username
    description: >-
      GitHub account that publishes the exact pinned public SSH key. Only PasevSU is accepted by this build.
  openpgp_fingerprint:
    name: OpenPGP fingerprint
    description: >-
      Full OpenPGP fingerprint of the GitHub-registered signing key. A detached OpenPGP signature of a one-time challenge is required.
