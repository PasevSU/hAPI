configuration:
  github_username:
    name: GitHub-Benutzername
    description: >-
      GitHub-Konto mit dem exakt festgelegten öffentlichen SSH-Schlüssel. Dieser Build akzeptiert nur PasevSU.
  openpgp_fingerprint:
    name: OpenPGP-Fingerabdruck
    description: >-
      Vollständiger OpenPGP-Fingerabdruck des bei GitHub registrierten Signaturschlüssels. Ein abgetrennter OpenPGP-Nachweis ist erforderlich.
