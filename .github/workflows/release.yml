name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия за изданието (напр. 0.52.0). Празно = текущата от config.yaml"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build + verify (Ubuntu · Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # S20 пуска целия тестов пакет, а `tests/storage-tree-api.cjs` пише в `/share`
      # (истинският път в add-on-а). Без тази папка проверката пада с EACCES.
      - name: Prepare /share (тестовете за пътя на порталите го изискват)
        run: sudo mkdir -p /share /media && sudo chown "$USER" /share /media

      - name: Build release (includes full test suite)
        shell: bash
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/build-release.cjs --version "${{ inputs.version }}"
          else
            node scripts/build-release.cjs
          fi
        env:
          CI: "true"

      - name: Verify release (all scenarios incl. tests)
        run: node scripts/verify-release.cjs --with-tests
        env:
          CI: "true"

      - name: Check tag matches config.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-tag-version.cjs
        env:
          CI: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hapi-enterprise-release
          path: dist/
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/hapi_enterprise-*.tar.gz
            dist/hapi_enterprise-integration-*.zip
            dist/repository.yaml
            dist/RELEASE.json
            dist/SHA256SUMS.txt
          # Без `generate_release_notes`: то ЗАМЕНЯ текста, който
          # `release/publish-release.ps1` е написал (бележките от CHANGELOG).
          # Тук се качват само артефактите; текстът се пази.
