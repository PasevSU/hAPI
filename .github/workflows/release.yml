name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия за изданието (напр. 0.52.0). Празно = текущата от config.yaml"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build + verify (Ubuntu · Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # S20 пуска целия тестов пакет, а `tests/storage-tree-api.cjs` пише в `/share`
      # (истинският път в add-on-а). Без тази папка проверката пада с EACCES.
      - name: Prepare /share (тестовете за пътя на порталите го изискват)
        run: sudo mkdir -p /share /media && sudo chown "$USER" /share /media

      - name: Build release (includes full test suite)
        shell: bash
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/build-release.cjs --version "${{ inputs.version }}"
          else
            node scripts/build-release.cjs
          fi
        env:
          CI: "true"

      - name: Verify release (all scenarios incl. tests)
        run: node scripts/verify-release.cjs --with-tests
        env:
          CI: "true"

      - name: Check tag matches config.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-tag-version.cjs
        env:
          CI: "true"

      # Бележките идват от CHANGELOG-а за ТОЧНО тази версия. Дотук тагът създаваше release с
      # празно тяло и текстът се слагаше на ръка след това — едно забравено копиране оставяше
      # изданието без обяснение какво съдържа (случи се с 0.69.95 и 0.69.96).
      - name: Build release notes from CHANGELOG
        run: node scripts/release-notes.cjs --out dist/RELEASE-NOTES.md

      # Заглавието също се извежда от версията: иначе всяко издание се казва „v0.69.98“ и
      # човек трябва да го преименува на ръка, за да разбере за какво е.
      - name: Resolve release name
        id: release_name
        run: echo "value=hAPI Enterprise $(node -e "process.stdout.write(require('./scripts/release-notes.cjs').currentVersion())")" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hapi-enterprise-release
          path: dist/
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.release_name.outputs.value }}
          files: |
            dist/hapi_enterprise-*.tar.gz
            dist/hapi_enterprise-integration-*.zip
            dist/hapi-enterprise-gui-*.zip
            dist/repository.yaml
            dist/RELEASE.json
            dist/SHA256SUMS.txt
          # Без `generate_release_notes`: то ЗАМЕНЯ текста, който сме подготвили.
          # Тялото идва от `scripts/release-notes.cjs` (секцията от CHANGELOG-а), а тук се
          # качват само артефактите.
          body_path: dist/RELEASE-NOTES.md
