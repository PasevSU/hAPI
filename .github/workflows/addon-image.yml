name: Add-on image

# ГОТОВ ОБРАЗ ЗА ADD-ON-А (0.69.153).
#
# Защо: дотук `config.yaml` нямаше `image:`, тоест store-ът не тегли образ, а ГО СТРОИ на
# машината при всяко обновяване. На Raspberry Pi 4 това е измерено 127 s build + рестарт на
# всяко издание — бавно, зависимо от интернет и от toolchain, и провал в build оставя
# add-on-а на старата версия без ясна причина.
#
# Тук образът се строи ВЕДНЪЖ за всяка архитектура и се публикува в GHCR по конвенцията на
# Home Assistant: `ghcr.io/<owner>/{arch}-addon-<slug>` с тагове `<version>` и `latest`.
# Когато този workflow мине успешно за дадено издание, `image:` в `config.yaml` може да сочи
# към него — store-ът тогава само тегли.
#
# ВАЖНО: пакетът в GHCR трябва да е PUBLIC, иначе Supervisor не може да го изтегли
# анонимно. Проверката е в `scripts/check-addon-image.ps1`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Образ · ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Версията се чете от манифеста, не от тага: така образът и `config.yaml` не могат
      # да се разминат, дори ако тагът е сбъркан.
      #
      # Owner-ът ЗАДЪЛЖИТЕЛНО се сваля до малки букви: Docker отказва таг с главни букви в
      # името на хранилището (`repository name must be lowercase`), а GitHub login-ът е
      # `PasevSU`. Първият пуск на този workflow падна точно на това.
      - name: Версия от config.yaml
        id: meta
        run: |
          version=$(grep -m1 '^version:' hapi_enterprise/config.yaml | sed -E 's/.*"([^"]+)".*/\1/')
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ matrix.arch }}-addon-hapi_enterprise" >> "$GITHUB_OUTPUT"
          echo "::notice::образ ${{ matrix.arch }} за версия $version · ${owner}"

      - name: Build и push
        uses: docker/build-push-action@v6
        with:
          context: hapi_enterprise
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=hAPI Enterprise
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
