name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Integration test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run test suite
        run: |
          for f in tests/*.cjs; do
            echo "== $f =="
            node "$f" || exit 1
          done
        env:
          CI: "true"
