name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    name: Integration tests (Ubuntu · Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release artifacts (тестовете четат dist/)
        run: node scripts/build-release.cjs
        env:
          CI: "true"

      - name: Run full test suite
        shell: bash
        run: |
          failed=0
          for f in tests/*.cjs; do
            echo "== $f =="
            node "$f" || failed=1
          done
          exit $failed
        env:
          CI: "true"

  test-windows:
    name: Smoke + edge runtime (Windows · Node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test
        run: node tests/smoke.cjs
        env:
          CI: "true"

      - name: Windows edge runtime test
        run: node tests/edge-runtime.cjs
        env:
          CI: "true"

  build-addon:
    name: Add-on image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64, armv7]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build add-on with the Home Assistant builder (no push)
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --image "ghcr.io/pasevsu/hapi-enterprise-{arch}" \
            --target /data/hapi_enterprise \
            --test
