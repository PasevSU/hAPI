name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    name: Integration tests (Ubuntu · Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build release artifacts (тестовете четат dist/)
        run: node scripts/build-release.cjs
        env:
          CI: "true"

      - name: Prepare /share (тестовете за пътят на порталите го изискват)
        run: sudo mkdir -p /share /media && sudo chown "$USER" /share /media

      - name: Run full test suite
        shell: bash
        run: |
          failed=0
          for f in tests/*.cjs; do
            echo "== $f =="
            # Таван от 300 s за тест: тест, който не излезе (напр. оставен сирак държи
            # тръбите), НЕ бива да заключва целия job за 10+ минути без лог.
            # `|| status=$?` не е завъртулка: job-ът върви с `bash -e`, а голо
            # `timeout ... node` при провал прекратява целия цикъл след ПЪРВИЯ паднал
            # тест (случи се: спря на pgp-engine и никой не разбра за останалите).
            status=0
            timeout -k 10 300 node "$f" || status=$?
            if [ "$status" -ne 0 ]; then
              if [ "$status" -eq 124 ]; then
                echo "::error::TIMEOUT $f (300 s) — тестът не излезе"
              fi
              # Името се показва като анотация: иначе провалът се вижда само като код 1
              # в края и трябва да се гадае кой тест е (случвало се е).
              echo "::error::FAILED $f (exit $status)"
              failed=1
            fi
          done
          exit $failed
        env:
          CI: "true"

  test-windows:
    name: Smoke + edge runtime (Windows · Node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Smoke test
        run: node tests/smoke.cjs
        env:
          CI: "true"

      - name: Windows edge runtime test
        run: node tests/edge-runtime.cjs
        env:
          CI: "true"

  lint:
    name: Lint (eslint · Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Dev зависимостите са само eslint/prettier — add-on-ът и тестовете работят без тях.
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      # `eslint-suppressions.json` е базовата линия за наследените находки: тя пази
      # днешното състояние, а НОВА находка (нов файл, нов ред) чупи работата.
      - name: ESLint (нов код трябва да е чист)
        run: npm run lint

  build-addon:
    name: Add-on image (всички обявени архитектури)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `home-assistant/builder` е обявен за deprecated и подава невалиден таг
      # (`/ghcr.io/<owner>/...` — с воден наклон), затова образът се строи направо
      # с buildx: без push, само доказателство, че Dockerfile-ът се билдва за
      # всяка архитектура, която config.yaml обещава.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the add-on image (без push)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --output type=oci,dest=/tmp/hapi-enterprise-image.tar \
            hapi_enterprise
