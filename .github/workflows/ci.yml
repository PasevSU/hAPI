name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    name: Integration tests (Ubuntu · Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build release artifacts (тестовете четат dist/)
        run: node scripts/build-release.cjs
        env:
          CI: "true"

      - name: Prepare /share (тестовете за пътят на порталите го изискват)
        run: sudo mkdir -p /share /media && sudo chown "$USER" /share /media

      - name: Run full test suite
        shell: bash
        run: |
          failed=0
          for f in tests/*.cjs; do
            echo "== $f =="
            node "$f" || failed=1
          done
          exit $failed
        env:
          CI: "true"

  test-windows:
    name: Smoke + edge runtime (Windows · Node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke test
        run: node tests/smoke.cjs
        env:
          CI: "true"

      - name: Windows edge runtime test
        run: node tests/edge-runtime.cjs
        env:
          CI: "true"

  build-addon:
    name: Add-on image (всички обявени архитектури)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `home-assistant/builder` е обявен за deprecated и подава невалиден таг
      # (`/ghcr.io/<owner>/...` — с воден наклон), затова образът се строи направо
      # с buildx: без push, само доказателство, че Dockerfile-ът се билдва за
      # всяка архитектура, която config.yaml обещава.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build the add-on image (без push)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --output type=oci,dest=/tmp/hapi-enterprise-image.tar \
            hapi_enterprise
