<!doctype html>
<html lang="bg">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <title data-i18n="doc.title">Портал за документи</title>
  <link rel="stylesheet" href="/portal.css" />
</head>

<body>
  <!-- Адресите НЕ се строят в страницата. Сървърът записва тук базовия адрес и пътя на
       публичното API, изчислени от hapi_enterprise/links.js (единственият builder). Така
       копираният линк е абсолютен и верен и когато страницата е зад прокси с префикс
       (вж. documentation/02_TO_BE_ARCHITECTURE/LINK_AND_STORAGE_CONTRACT.md, правило 6). -->
  <div id="hapi-boot" hidden data-base="{{BASE}}" data-api="{{API}}" data-folder="{{FOLDER}}" data-folders="{{FOLDERS}}"
    data-qr="{{QR}}"></div>

  <!-- PP-04: страницата не съдържа НИТО ЕДИН линк. И скокът към съдържанието е бутон —
       `<a>` се ползва само временно при сваляне на файл, за да отвори диалога на браузъра. -->
  <button type="button" class="skip" id="skip" data-i18n="nav.skip.content">Към съдържанието</button>

  <header class="hero">
    <div class="wrap">
      <!-- Името на хранилището: едно и също на трите езика (марка, не описание). -->
      <p class="brand" data-i18n="brand.name">ПАП БОКС</p>
      <p class="eyebrow">
        <span class="dot" aria-hidden="true"></span>
        <span id="visibility" data-i18n="visibility.public">Портал за документи</span>
      </p>
      <h1 id="title" data-i18n="doc.loading">Зареждане…</h1>
      <p id="description" class="lead" hidden></p>
      <ul id="badges" class="badges" data-i18n-aria="header.categories" aria-label="Категории"></ul>
      <!-- Криптографската защита се казва ЯВНО на всеки език: SHA-256 на всеки файл,
           подписан достъп и AES-256-GCM при шифроване. -->
      <p class="crypto" data-i18n="crypto.line">Криптографска защита: SHA-256 за всеки файл,
        подписан достъп и AES-256-GCM при шифроване.</p>
      <p id="contact" class="contact" hidden></p>
      <!-- PP-01: идентификаторът на портала. Адресът се мени със slug-а, id-то не. -->
      <p class="ident">
        <span class="ident-label" data-i18n="header.portalId">Идентификатор на портала</span>
        <code id="portal-id" class="mono">…</code>
        <button type="button" id="copy-id" class="btn btn-ghost btn-sm" data-i18n="header.copyId"
          data-i18n-title="header.copyId.title" title="Копирай идентификатора">Копирай</button>
      </p>
      <div class="hero-actions">
        <button type="button" id="copy-link" class="btn btn-ghost" data-i18n="header.copyLink">Копирай адреса</button>
        <button type="button" id="folder-open" class="btn btn-ghost" data-i18n="header.folder" hidden>Отвори
          папката</button>
        <!-- PP-04: „API“ и „Манифест“ НЕ водят навън. Това са бутони, които разгъват
             информацията в самата страница — посетителят не получава адрес за копиране
             и не попада на суров JSON в нов таб. -->
        <button type="button" id="api-open" class="btn btn-ghost" aria-controls="doc-info" aria-expanded="false"
          data-i18n="header.api">API</button>
        <button type="button" id="manifest-open" class="btn btn-ghost" aria-controls="doc-info" aria-expanded="false"
          data-i18n="header.manifest">Манифест</button>
        <!-- PP-14: езикът на страницата е избор на посетителя, не на издателя. -->
        <label class="lang">
          <span class="sr-only" data-i18n="lang.label">Език</span>
          <select id="lang" class="lang-select" aria-label="Език">
            <option value="bg">Български</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <!-- PP-03/PP-06: какво представлява порталът и какво съдържа (брой файлове, обем, вид). -->
    <section class="panel summary-panel" aria-labelledby="summary-title">
      <h2 id="summary-title" data-i18n="summary.title">Какво съдържа този портал</h2>
      <p id="summary" class="summary-text" data-i18n="doc.loading">Зареждане…</p>
      <ul id="summary-list" class="summary-list"></ul>
      <!-- PP-12: целият портал с едно натискане. Показва се само когато има файлове,
           които могат да се свалят без ключ. -->
      <div class="package-bar" id="package-bar">
        <button id="package-btn" class="btn btn-primary" type="button" data-i18n="package.button" hidden>Изтегли всички
          (ZIP)</button>
        <p id="package-note" class="more" role="status" aria-live="polite" hidden></p>
      </div>
    </section>

    <!-- PP-04: информацията, която дотук се даваше като линк към суров JSON, се
         показва ТУК — в същата страница, с четими етикети. -->
    <section class="panel doc-info" id="doc-info" aria-labelledby="doc-info-title" hidden>
      <div class="panel-head">
        <h2 id="doc-info-title"></h2>
        <button type="button" id="doc-info-close" class="btn btn-ghost btn-sm" data-i18n="info.close">Затвори</button>
      </div>
      <p id="doc-info-note" class="hint"></p>
      <p id="doc-info-status" class="status" role="status" aria-live="polite" hidden></p>
      <dl id="doc-info-body" class="info-list"></dl>
    </section>

    <section class="panel" aria-labelledby="files-title">
      <div class="panel-head">
        <h2 id="files-title" data-i18n="files.title">Файлове</h2>
        <span id="count" class="count" aria-live="polite"></span>
      </div>
      <div class="toolbar" id="toolbar">
        <label class="search">
          <span class="sr-only" id="q-label">Търси по име</span>
          <input id="q" type="search" placeholder="Търси по име" autocomplete="off" />
        </label>
      </div>
      <p id="status" class="status" role="status" aria-live="polite" data-i18n="doc.loading">Зареждане…</p>
      <ul id="files" class="files"></ul>
      <p id="empty" class="empty" data-i18n="files.empty.public" hidden>Няма достъпни файлове за показване.</p>
      <p id="more" class="more" hidden></p>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p id="foot-note"></p>
    </div>
  </footer>

  <script src="/portal-i18n.js" defer></script>
  <script src="/portal.js" defer></script>
</body>

</html>
