configuration:
  # Нищо в кода не чете тези две опции. Дотук описанието им обещаваше „вход в конзолата“,
  # какъвто няма — човек слагаше парола в plaintext без полза.
  username:
    name: Потребителско име за конзолата (не се ползва — оставете празно)
    description: Остава само за стари конфигурации. Никой код не го чете; входът става чрез самоличността на Home Assistant (user_roles / group_roles).
  password:
    name: Парола за конзолата (не се ползва — оставете празно)
    description: Остава само за стари конфигурации. Никой код не я чете. Не слагайте истинска парола тук.
  token:
    name: Админ токен (задължителен)
    description: >-
      Задължителен при старт. Поне 24 знака, без стойност-заглушка и без очевиден шаблон.
      Без него add-on-ът отказва старт (ADMIN_TOKEN_REQUIRED) и никога не генерира токен сам.
      В secrets.yaml стойността се казва hapi_token, но Home Assistant не разширява !secret в
      опциите на add-on-а — тук се въвежда самата стойност.
      НЕ ползвай Home Assistant long-lived access token: той отваря и целия HA API, тоест едно
      изтичане на hAPI токена е изтичане на Home Assistant. При такава форма логът пише
      ADMIN_TOKEN_LOOKS_LIKE_HA_LLAT.
  pgp_path_public:
    name: Път до публичния PGP ключ (по избор)
    description: >-
      Пълен път в контейнера, напр. /homeassistant/_openpgpV6/public.asc. По избор: ако е празно
      или файлът липсва, add-on-ът стартира нормално и PGP остава недостъпен.
  pgp_path_secret:
    name: Път до частния PGP ключ (по избор)
    description: >-
      Пълен път до частния ключ, защитен с парола, напр. /homeassistant/_openpgpV6/secret.asc
      (може и private.asc). Нужен е за четене на криптираните пътища и на работната папка.
  pgp_path_pass:
    name: Път до файла с паролата (по избор)
    description: >-
      Пълен път до файла с HAPI_PGP_KEY_PASS=…, напр. /homeassistant/_openpgpV6/.env.
      Сочи към .env, никога към .env.example (шаблонът е с празна стойност).
  pgp_key_pass:
    name: Парола на PGP ключа (по избор)
    description: >-
      Самата парола, пази се в /data/options.json. Има предимство пред pgp_path_pass.
      Никога не се печата в лог и не се връща от API-то.
  pgp_encrypt_paths:
    name: Криптиране на вътрешните пътища
    description: >-
      Пази storagePathEnc (криптиран с PGP) вместо открития път в db.json. Изисква зареден
      ключ: без ключ add-on-ът пак стартира и пише pgp.encryption.without-key в лога, но
      първото криптиране пада с PGP_SECRET_KEY_REQUIRED (503) — нищо не остава „уж криптирано“.
      Състоянието се вижда на GET /admin/api/pgp/keyring.
  pgp_encrypt_workdir:
    name: Криптиране на работната папка
    description: >-
      Криптира съдържанието в работната папка на портала (AES-256-GCM с ключ за файла, обвит с
      PGP). Изисква зареден ключ. Без ключ и парола файловете не могат да се прочетат.
  db_name:
    name: Име на базата и портала
    description: Име на първия портал и на файла на базата.
  memory_limit_mb:
    name: Лимит на паметта (MB)
    description: >-
      1024 по подразбиране — стойността, сверена с работещото разпределение. 0 оставя
      default-а на Node.js (около половината от паметта на контейнера), а 256-384 е
      безопасният диапазон на Raspberry Pi; стойността се подава като
      --max-old-space-size.
  storage_mirror:
    name: Второ копие на файловете (папка или s3)
    description: >-
      Папка (в /share, /media или /config) или адрес
      `s3://bucket/prefix?endpoint=…&region=…&lock=дни`. Всяко качване се записва и там,
      прочита се обратно и се сверява с SHA-256 през POST /admin/api/storage/mirror/verify;
      липсваща или повредена страна се възстановява (`repair`). С `lock=дни` обектите в S3
      се заключват (Object Lock COMPLIANCE) и не се трият, докато трае срокът.
  s3_access_key:
    name: S3 ключ за достъп (само при s3 огледало)
    description: >-
      Задължителен, когато `storage_mirror` е `s3://…`. Без него s3 целта се отказва при
      старт, вместо тихо да не пише никъде.
  s3_secret_key:
    name: S3 таен ключ (само при s3 огледало)
    description: >-
      Двойка на ключа за достъп. Не се печата в лога и не влиза в адреса на огледалото.
  backup_mirror:
    name: Огледална папка за архивите
    description: >-
      Опционално второ място за архивите на базата (в /share, /media или
      /config). Всяко копие се проверява с SHA-256; копие, което не съвпада с
      оригинала, се изтрива — счупено огледало не може да изглежда като валиден архив.
  backup_folder:
    name: Папка за резервни копия
    description: Папка за планираните архиви. Относителен път се решава в /share.
  db_id:
    name: Идентификатор на базата
    description: Идентификатор, използван в съставните DOCFLOW ключове.
  profiles:
    name: Конфигурационни профили
    description: JSON обект или път с дефиниции за портали, папки и полета.
  public_domain:
    name: Публичен домейн
    description: >-
      Външно име, използвано в QR кодовете и адресите на порталите, например
      pasev.asuscomm.com.
  public_gateway:
    name: Публичен API шлюз
    description: >-
      Включен по подразбиране в това разпределение (порт 8088 НЕ е публикуван в
      config.yaml, тоест достъпен е само през reverse proxy на същия хост).
  public_same_origin:
    name: Адреси в същия origin
    description: >-
      Включено по подразбиране: връща относителни адреси, защото API-то отговаря на хоста и
      порта на Home Assistant. Изключено → абсолютни адреси с CORS.
  user_roles:
    name: Роли на потребители
    description: >-
      Опционална JSON карта от идентичност на Home Assistant към роля. Ключът се търси
      в `X-Remote-User-Name`, после в `X-Remote-User-Id`, после в
      `X-Remote-User-Display-Name`. По подразбиране всеки Ingress потребител е admin —
      ползвайте я само за понижаване, напр. {"guest": "viewer"}.
      Роли: `admin`, `operator`, `viewer` и съдебните `judge`, `prosecutor`, `clerk`,
      `expert`. Съдебните роли САМО четат доказателства и веригата на пазене; изключение
      е `expert`, който може да представи становище. Непозната роля се отхвърля, за да не
      даде права правописна грешка. В това разпределение картата е попълнена (потребителят
      на инсталацията → `admin`) — това е стойността, с която add-on-ът е изпитан.
  group_roles:
    name: Роли на групи
    description: >-
      Опционална JSON карта от име на група към роля за reverse proxy, който добавя
      `X-Remote-Groups`. Home Assistant не изпраща групи, затова при обикновен add-on
      тази карта остава празна.
  storage_location:
    name: Място за съхранение
    description: >-
      Къде живеят документите и базата. `addon_config` (подразбиране) е собствената папка
      на add-on-а (/config в контейнера) и влиза в snapshot-ите на Supervisor; `share` е
      споделената папка на Home Assistant (видима през Samba); `media` е другата споделена
      папка.
  storage_subdirectory:
    name: Подпапка за съхранение
    description: >-
      Подпапка в избраното място; по подразбиране `hapi_enterprise`, тоест
      `/config/hapi_enterprise` при `addon_config`. Позволени са до три нива (напр.
      `documents/hapi/data`). Ако преди обновяването данните са били в старата папка,
      add-on-ът продължава да ги ползва и пише STORAGE_LEGACY_LOCATION в лога, вместо да
      стартира с празна база.
  storage_mode:
    name: Режим на съхранение
    description: >-
      local използва директно монтираната папка; ha_network изисква активен мрежов
      storage mount в Home Assistant.
  storage_mount_name:
    name: Име на мрежовия storage
    description: Име на мрежовия storage mount в Home Assistant (само за ha_network).
  min_free_mb:
    name: Минимум свободно място (MB)
    description: >-
      1000 по подразбиране. Стартирането се проваля, ако свободното място е под тази
      стойност — така пълен диск не може тихо да повреди одитната следа.
  log_level:
    name: Ниво на логове
    description: >-
      error, warn, info, debug или trace. debug добавя по един ред на HTTP заявка; trace е
      за много подробна диагностика. Файловете се пишат в logs/ в папката на add-on-а.
  config_dir:
    name: Директория с правила
    description: >-
      Папка с файловете с правила за достъп и експорт. Празно → /config/rules, където
      при първи старт се копират вградените стойности и могат да се редактират.
  evidence_portal_deploy:
    name: Публикуване на QR портала за доказателства
    description: >-
      Копира портала Evidence View в `www/hapi/data` от конфигурацията на Home Assistant —
      `/config/www/hapi/data` както го вижда HA, `/homeassistant/www/hapi/data` в контейнера
      на add-on-а — за да го сервира HA на /local/hapi/data/portal.html. Папката се
      разпознава по `configuration.yaml`; `EVIDENCE_PORTAL_ROOT` е само за друго място.
      Порталът чете данните си от API за доказателства; самите файлове не се показват.
  tsa_enabled:
    name: RFC 3161 времеви печати
    description: >-
      Включено по подразбиране в това разпределение. Без интернет заявката се проваля
      затворено (breaker) и НЕ блокира старта. Изключено → endpoint-ите връщат 409 и не се
      създават токени; нищо не се фалшифицира.
  tsa_start_url:
    name: START TSA адрес
    description: >-
      Доставчик на времеви печат за START границата (по подразбиране DFN). Трябва да е
      http(s) адрес; токенът се пази като .tsr файл в папката на хранилището.
  tsa_stop_url:
    name: STOP TSA адрес
    description: >-
      Доставчик на времеви печат за STOP границата (по подразбиране DigiCert). STOP
      подпечатва затварящия хеш: SHA-256 от START digest и отпечатъка на START токена.
  sign_packages:
    name: Подписване на експортните пакети
    description: >-
      Подписва всеки експортен пакет (.zip) с избрания OpenPGP ключ по подразбиране.
      Първо трябва да е прикачен ключ в конзолата (Настройки → PGP ключове).
  signing_key:
    name: Ключ за подписване
    description: >-
      Отпечатък или key ID на OpenPGP ключа за подписване на пакети и разписки. Празно →
      ключът, избран в конзолата.
  encrypt_files:
    name: Шифроване на файловете
    description: >-
      Шифрова новите качвания на диска (AES-256-GCM с админ ключа) по подразбиране.
      Явният X-File-Encrypt header продължава да има приоритет за всяко качване.
  portal_folder_copy:
    name: Копие на файловете в папката на портала
    description: >-
      Изключено по подразбиране: прикаченият към портал файл остава в данните на add-on-а
      и НЕ създава папка в /share. Включи, ако искаш копие с истинското име и в папката
      на портала (storage_root). Файловете в /share се качват от „Папки на портала“ — там,
      където сам избереш папката.
  portal_skin:
    name: Кожа на публичната страница на портала
    description: >-
      classic — изпитаният стил (по подразбиране, нищо не се променя). modern — втората кожа:
      стъклени карти, едра типография, люспести бутони и мрежа от карти за файловете.
      Двете ползват един и същ HTML — сменя се само стилът, който QR кодът отваря.
  tls_cert:
    name: TLS сертификат
    description: >-
      Път до PEM сертификат (в /config, /ssl или /share). Заедно с ключа кара add-on-а
      да сервира собствените си листенъри по HTTPS.
  tls_key:
    name: TLS частен ключ
    description: >-
      Път до PEM частния ключ, който отговаря на сертификата. Двете опции трябва да сочат
      четими файлове, иначе add-on-ът отказва старт.
  visitor_ip_mode:
    name: Сензори · режим на IP
    description: >-
      Какво се пази от адреса на посетителя: hashed (необратим хеш, по подразбиране),
      masked (мрежа/16) или full (пълен адрес — лични данни). Празно → подразбирането.
      Същото се задава и от конзолата: Настройки → Сензори.
  visitor_retention_days:
    name: Сензори · срок на записа (дни)
    description: >-
      Колко дни се пазят посещенията, преди да се изтрият. 0 или празно → подразбирането
      (90 дни). Стойността се пренастройва и от конзолата.
  visitor_geoip_path:
    name: Сензори · файл с геобаза
    description: >-
      Абсолютен път до MMDB файл (GeoIP) за държава на посетителя. Празно → без геобаза:
      държавите остават неизвестни, останалите сензори работят.
network:
  8099/tcp: Вътрешно API
  8088/tcp: Публичен API шлюз
