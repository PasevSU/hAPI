<!doctype html>
<html lang="bg">

<head>
  <meta charset="utf-8" />
  <title>Протокол за предаване и приемане</title>
  <style>
    @page {
      size: A4;
      margin: 18mm 16mm;
    }

    body {
      font-family: "DejaVu Sans", Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.45;
      color: #111;
    }

    header {
      border-bottom: 1px solid #999;
      padding-bottom: 6px;
      margin-bottom: 16px;
      font-size: 9pt;
      color: #555;
    }

    h1 {
      font-size: 17pt;
      margin: 0 0 4px;
    }

    .sub {
      font-size: 10pt;
      color: #555;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 16px;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
      font-size: 10pt;
    }

    th {
      background: #f2f2f2;
      font-weight: 600;
    }

    .sign {
      display: flex;
      gap: 24px;
      margin-top: 28px;
    }

    .sign div {
      flex: 1;
      border-top: 1px solid #333;
      padding-top: 6px;
      font-size: 9pt;
      color: #555;
    }

    footer {
      border-top: 1px solid #999;
      margin-top: 24px;
      padding-top: 6px;
      font-size: 9pt;
      color: #555;
    }
  </style>
</head>

<body>
  <header>Протокол · <span>номер и дата</span></header>
  <h1>Протокол за предаване и приемане</h1>
  <p class="sub">Съставен в два еднообразни екземпляра, по един за всяка страна.</p>

  <table>
    <tr>
      <th style="width: 32%">Предава</th>
      <td>&nbsp;</td>
    </tr>
    <tr>
      <th>Приема</th>
      <td>&nbsp;</td>
    </tr>
    <tr>
      <th>Основание</th>
      <td>&nbsp;</td>
    </tr>
    <tr>
      <th>Предмет</th>
      <td>&nbsp;</td>
    </tr>
    <tr>
      <th>Състояние при приемане</th>
      <td>&nbsp;</td>
    </tr>
  </table>

  <p>Забележки: </p>
  <div class="sign">
    <div>Предал (име, подпис)</div>
    <div>Приел (име, подпис)</div>
  </div>
  <footer>Страница 1</footer>
</body>

</html>
