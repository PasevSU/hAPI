# Проектен пример — НЕ е готова конфигурация за публикуване.
# 8099 обслужва само Ingress (администрация през Home Assistant).
# 8088 е отделен Public API Gateway; не се отваря автоматично и изисква собствен
# HTTPS reverse proxy и домейн, различен от този на Home Assistant.
name: hAPI ENTERPRICE
slug: hapi_enterprice
version: 0.1.0
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: hAPI ENTERPRICE
panel_icon: mdi:api
panel_admin: true

ports:
  8088/tcp: null

ports_description:
  8088/tcp: Public API Gateway

# За да работи API-то на същия IP и порт като Home Assistant, включете:
#   public_same_origin: true
# и маршрутизирайте /p/ и /api/public/ към add-on-а на :8088 през reverse proxy.
options:
  public_domain: ""
  public_gateway: false
  public_same_origin: true

# Forensics of outgoing mail is NOT an add-on option, защото не се чете от
# add-on-а. Настройките на PasevSU Forensic Mail Framework (PSEMP) живеят на едно
# място — psemp-gateway/settings.default.json — и се споделят от двете половини:
#
#   version          X-PasevSU-Version
#   framework        X-PasevSU-Framework      (Forensic-Mail)
#   origin           X-PasevSU-Origin         (Thunderbird | PSEMP-Gateway)
#   organization     X-PasevSU-Organization   (PasevSU)
#   pgpFingerprint   X-PasevSU-PGP-Fingerprint (празно = хедърът се пропуска)
#   enableOts        X-PasevSU-OTS             (по подразбиране true → "pending")
#
# Thunderbird разширението (thunderbird-extension/) импортира същия файл от
# страницата си с настройки и записва обратно. origin НЕ се копира — той назовава
# производителя. Тест: psemp-gateway/test/settings-parity.cjs.
